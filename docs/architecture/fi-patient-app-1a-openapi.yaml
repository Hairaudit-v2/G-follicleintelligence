openapi: 3.1.0
info:
  title: Follicle Intelligence Patient Gateway API
  version: 1.0.4
  summary: FI Patient Gateway API — 1B–1E auth, imaging, journey/appointments, billing/payments implemented; remaining domains proposed
  description: |
    `/api/patient/v1` surface for an external patient mobile client.

    **1B implemented:** authentication foundation + `GET /api/patient/v1/me`.
    **1C implemented:** secure imaging list + signed upload intent + complete.
    **1D implemented:** patient-safe journey + appointments (read-only).
    **1E implemented:** billing summary, invoices, Stripe Checkout payment-session;
    reconciliation via existing verified Stripe webhook (`POST /api/fi-payments/stripe/webhook`).
    Remaining domain paths below remain proposed until later tickets.

    **Identity model:** Supabase Auth user (`auth.users.id`) linked via
    `fi_patients.portal_auth_user_id`. Canonical patient identity for all gateway
    operations is `fi_patients.id` resolved server-side — never trusted from the
    client body, query, or headers.

    **Auth (implemented):** `Authorization: Bearer <supabase_access_token>` is
    required for `/api/patient/v1/*`. Cookie sessions are intentionally not used
    as a fallback on this namespace (web portal cookie flows remain on `/patient/*`).
    Staff elevators (`x-fi-admin-key` / admin query keys) are rejected.

    **Fail-closed mapping:** missing token, invalid token, unlinked auth user,
    ambiguous portal mappings, inactive/archived/deceased/duplicate patients,
    wrong-tenant claims, and foreign patient-id claims are denied.

    **Tenant isolation:** resolved from the portal patient row; ownership guards
    require `tenant_id` + `patient_id` match for domain routes. Journey,
    appointment, and invoice reads re-derive identity server-side on every request.

    **Payments:** amount and currency are always server-derived from FiOS invoice
    balance. Browser/app return URLs are never authoritative — only verified Stripe
    webhook events reconcile payment success (idempotent).
x-fi-ticket: FI-PATIENT-APP-1E
x-fi-status: billing-payments-implemented
x-fi-constraints:
  - no_mobile_app_implementation_in_1e
  - no_patient_data_migration_in_1e
  - no_schema_changes_in_1e
  - no_messaging_in_1e
  - no_second_ledger_in_1e
  - no_raw_card_data
  - no_client_declared_paid_status
  - no_redirect_based_payment_confirmation
  - no_raw_storage_paths_in_responses
  - no_staff_notes_in_patient_responses

servers:
  - url: https://{host}
    variables:
      host:
        default: follicleintelligence.ai

tags:
  - name: Session
    description: Auth-bound identity and portal linkage
  - name: Profile
    description: Patient-safe profile / clinic context
  - name: Imaging
    description: Clinical photography upload and patient-safe viewing
  - name: Journey
    description: Patient-safe FiOS journey stage and next action
  - name: Appointments
    description: Patient appointment visibility (read-only in 1D)
  - name: Billing
    description: Patient-safe account summary, invoices, and payment sessions
  - name: Medications
    description: Prescription lines and reorder requests
  - name: Account
    description: Legacy proposed account paths — superseded by /billing in 1E
  - name: Messaging
    description: Deferred — no patient inbox exists today
  - name: Consent
    description: Trial / photography consent status for gated uploads

paths:
  /api/patient/v1/me:
    get:
      tags: [Profile]
      operationId: getPatientMe
      summary: Patient-safe profile for the authenticated portal patient
      description: |
        **Implemented (FI-PATIENT-APP-1B).**

        Requires `Authorization: Bearer <supabase_access_token>`.
        Server resolves `auth.users.id` via `resolveAuthUserId(request)`, then
        loads the unique `fi_patients` row with matching `portal_auth_user_id`
        (`requirePatientGatewayContext`).

        Client-supplied `patientId` / `tenantId` (query, headers, or body) are
        never used for resolution. If provided and mismatched, the request is
        denied (`ownership_denied` / `wrong_tenant`).

        Response excludes `portal_auth_user_id`, admin notes, CRM internals,
        service-role secrets, and signed URLs.
      security:
        - bearerAuth: []
      parameters:
        - name: patientId
          in: query
          required: false
          description: Optional claim only — mismatch denies; never used for resolution
          schema:
            type: string
            format: uuid
        - name: tenantId
          in: query
          required: false
          description: Optional claim only — mismatch denies; never used for resolution
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Patient-safe profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatientMeResponse"
        "401":
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
              examples:
                missing:
                  value: { ok: false, error: "Authentication required.", code: "unauthenticated" }
                invalid:
                  value: { ok: false, error: "Invalid or expired credentials.", code: "invalid_token" }
        "403":
          description: Unlinked, inactive, ambiguous, wrong-tenant, ownership, or staff credential rejection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
              examples:
                unlinked:
                  value:
                    {
                      ok: false,
                      error: "No patient portal linkage found for this account.",
                      code: "unlinked",
                    }
                ownership:
                  value:
                    {
                      ok: false,
                      error: "Patient identity mismatch. Canonical patient is resolved server-side.",
                      code: "ownership_denied",
                    }

  /api/patient/v1/tenants/{tenantId}/consent:
    get:
      tags: [Consent]
      operationId: getPatientConsentStatus
      summary: Photography / treatment consent gate status
      description: |
        Wraps `loadTrialConsentGateStatus`. When consent is required and missing,
        imaging uploads must fail closed.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/tenantId"
      responses:
        "200":
          description: Consent gate status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsentStatusResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/patient/v1/images:
    get:
      tags: [Imaging]
      operationId: listPatientImages
      summary: List images for the authenticated portal patient
      description: |
        **Implemented (FI-PATIENT-APP-1C).**

        Returns active `fi_patient_images` rows for the server-resolved patient/tenant
        only. Media is exposed as short-lived signed `thumbnailUrl` values — never
        raw storage paths. Staff AI / graft / diagnostic metadata is omitted.

        Patient-facing category vocabulary uses gateway slots
        (`front_hairline`, `top_crown`, `donor_area`) mapped server-side to FiOS
        pathway fields.
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 40
      responses:
        "200":
          description: Patient-owned images
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatientGatewayImageListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/patient/v1/images/upload-intent:
    post:
      tags: [Imaging]
      operationId: createPatientImageUploadIntent
      summary: Create a short-lived signed upload capability
      description: |
        **Implemented (FI-PATIENT-APP-1C).**

        Server derives patient/tenant from the Bearer session, validates the
        patient-facing slot + MIME + size, selects bucket/path, and returns a
        short-lived Supabase signed upload URL plus an HMAC `intentToken`.
        No service-role credentials are returned.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [category, mimeType, fileSize]
              properties:
                category:
                  type: string
                  enum: [front_hairline, top_crown, donor_area]
                mimeType:
                  type: string
                  enum:
                    - image/jpeg
                    - image/png
                    - image/webp
                    - image/heic
                    - image/heif
                fileSize:
                  type: integer
                  minimum: 1
                  maximum: 20971520
      responses:
        "200":
          description: Signed upload intent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatientGatewayUploadIntentResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/patient/v1/images/complete:
    post:
      tags: [Imaging]
      operationId: completePatientImageUpload
      summary: Verify ownership and register a completed upload
      description: |
        **Implemented (FI-PATIENT-APP-1C).**

        Verifies the HMAC intent against the current gateway context, rejects
        expired/replayed/tampered intents, confirms the storage object exists at
        the server-issued path, then registers via FiOS imaging services
        (`registerPreuploadedPatientImageRecord`). New rows start `held`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [intentToken]
              properties:
                intentToken:
                  type: string
                storagePath:
                  type: string
                  description: Optional; if provided must exactly match the issued intent path
      responses:
        "200":
          description: Upload registered
          content:
            application/json:
              schema:
                type: object
                required: [ok, imageId, status]
                properties:
                  ok:
                    type: boolean
                    const: true
                  imageId:
                    type: string
                    format: uuid
                  status:
                    type: string
                    enum: [held]
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/patient/v1/journey:
    get:
      tags: [Journey]
      operationId: getPatientJourney
      summary: Patient-safe journey stage and next action
      description: |
        **Implemented (FI-PATIENT-APP-1D).**

        Requires `Authorization: Bearer <supabase_access_token>`.
        Server resolves canonical patient/tenant via `requirePatientGatewayContext`,
        derives journey state from existing FiOS signals (`loadPatientJourneySignals`
        + optional persisted override), and returns a patient-safe stage vocabulary
        (`consultation` | `treatment` | `procedure` | `recovery` | `review` | `audit`).

        `nextAction` is always server-derived from FiOS state + upcoming owned
        appointments (e.g. `attend_appointment`, `upload_images`, `request_review`).
        Client-supplied `patientId` cannot alter the resolved identity.
        Internal workflow names, staff blockers, and admin hrefs are not exposed.
      security:
        - bearerAuth: []
      parameters:
        - name: patientId
          in: query
          required: false
          description: Optional claim only — mismatch denies; never used for resolution
          schema:
            type: string
            format: uuid
        - name: tenantId
          in: query
          required: false
          description: Optional claim only — mismatch denies; never used for resolution
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Patient-safe journey
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatientGatewayJourneyResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/patient/v1/appointments:
    get:
      tags: [Appointments]
      operationId: listPatientGatewayAppointments
      summary: List upcoming and past appointments for the authenticated patient
      description: |
        **Implemented (FI-PATIENT-APP-1D).**

        Loads bookings via `loadBookingsForPatient(serverTenantId, serverPatientId)`
        only. Returns patient-safe DTOs split into `upcoming` / `past` using
        instant comparison (timezone-safe). Staff notes, assignee IDs, revenue,
        CRM anchors, and metadata are excluded.

        Read-only in 1D — no booking mutation.
      security:
        - bearerAuth: []
      parameters:
        - name: patientId
          in: query
          required: false
          description: Optional claim only — mismatch denies; never used for resolution
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Patient-owned appointments
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatientGatewayAppointmentListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/patient/v1/appointments/{appointmentId}:
    get:
      tags: [Appointments]
      operationId: getPatientGatewayAppointment
      summary: Get one appointment after ownership re-check
      description: |
        **Implemented (FI-PATIENT-APP-1D).**

        Appointment IDs are untrusted. Server loads the booking for the
        resolved tenant, then re-verifies `tenant_id` + `patient_id` ownership
        before returning. Unlinked, foreign-patient, or wrong-tenant rows fail closed
        (`ownership_denied` / `wrong_tenant` / `not_found`).
      security:
        - bearerAuth: []
      parameters:
        - name: appointmentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Owned appointment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatientGatewayAppointmentResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/patient/v1/appointments/{appointmentId}/change-request:
    post:
      tags: [Appointments]
      operationId: requestPatientAppointmentChange
      summary: Request an appointment change (future — not implemented in 1D)
      description: |
        **Deferred (FI-PATIENT-APP-1D.1+).**

        1D is read-only. Do not mutate calendar bookings from the mobile client.
        A future change-request endpoint may record a patient intent for staff
        review without auto-rescheduling.
      security:
        - bearerAuth: []
      parameters:
        - name: appointmentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "501":
          description: Not implemented in 1D
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"

  /api/patient/v1/billing:
    get:
      tags: [Billing]
      operationId: getPatientBillingSummary
      summary: Patient-safe account / billing summary
      description: |
        **Implemented (FI-PATIENT-APP-1E).**

        Derives outstanding/paid totals from owned `fi_invoices` rows for the
        server-resolved patient/tenant only. Amounts are major currency units
        computed from FiOS cents. Client-supplied balances are never accepted.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Billing summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatientGatewayBillingSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/patient/v1/invoices:
    get:
      tags: [Billing]
      operationId: listPatientGatewayInvoices
      summary: List invoices for the authenticated patient
      description: |
        **Implemented (FI-PATIENT-APP-1E).**

        Returns patient-safe invoice DTOs only. Draft invoices are omitted.
        Staff margins, commissions, CRM anchors, and metadata are excluded.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Invoice list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatientGatewayInvoiceListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/patient/v1/invoices/{invoiceId}:
    get:
      tags: [Billing]
      operationId: getPatientGatewayInvoice
      summary: Get one invoice after ownership re-check
      description: |
        **Implemented (FI-PATIENT-APP-1E).**

        Invoice IDs are untrusted. Ownership is re-verified against the
        server-resolved patient/tenant. Includes patient-safe line items and
        payment history labels (no PAN/CVV/provider secrets).
      security:
        - bearerAuth: []
      parameters:
        - name: invoiceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Owned invoice
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatientGatewayInvoiceDetailResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/patient/v1/invoices/{invoiceId}/payment-session:
    post:
      tags: [Billing]
      operationId: createPatientInvoicePaymentSession
      summary: Create Stripe Checkout session for outstanding balance
      description: |
        **Implemented (FI-PATIENT-APP-1E).**

        Server re-checks invoice ownership, verifies the invoice is payable,
        derives outstanding amount + currency from FiOS, and creates a Stripe
        Checkout session via existing `createPaymentRequestForInvoice`.

        Optional body `amount` / `currency` claims are validated against
        server-derived values then ignored for derivation — mismatches deny.

        **Return contract:** success/cancel URLs (and deep links such as
        `folios://payment/return`) only tell the app to refresh billing state.
        They must never mark an invoice paid. Final settlement requires the
        verified Stripe webhook at `POST /api/fi-payments/stripe/webhook`
        (signature verification, idempotent event insert, amount/currency
        reconciliation against the payment request / invoice balance).
      security:
        - bearerAuth: []
      parameters:
        - name: invoiceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                amount:
                  type: number
                  description: Optional claim only — must match server outstanding or request is denied
                currency:
                  type: string
                  description: Optional claim only — must match invoice currency or request is denied
      responses:
        "200":
          description: Checkout session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatientGatewayPaymentSessionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/patient/v1/tenants/{tenantId}/visual-summary:
    get:
      tags: [Imaging]
      operationId: getPatientVisualSummary
      summary: Patient-visible visual summary reports
      description: |
        Reuses patient portal visual summary loaders
        (`loadPatientVisualSummary…` / sanitize helpers). Staff-only AI fields
        redacted.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/tenantId"
      responses:
        "200":
          description: Visual summary bundle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VisualSummaryResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/patient/v1/tenants/{tenantId}/appointments:
    get:
      tags: [Appointments]
      operationId: listPatientAppointments
      summary: List appointments for the linked patient
      description: |
        **Superseded by** `GET /api/patient/v1/appointments` (FI-PATIENT-APP-1D).
        Kept as a historical proposed shape; do not implement the tenant-scoped
        variant for the mobile gateway.

        Server loads via `loadBookingsForPatient(tenantId, resolvedPatientId)`
        and maps to a patient-safe DTO (no staff IDs, internal CRM lead fields,
        or operator notes unless explicitly patient-visible).
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/tenantId"
        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Appointments
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppointmentListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/patient/v1/tenants/{tenantId}/appointments/{bookingId}:
    get:
      tags: [Appointments]
      operationId: getPatientAppointment
      summary: Get one appointment owned by the linked patient
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/tenantId"
        - $ref: "#/components/parameters/bookingId"
      responses:
        "200":
          description: Appointment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatientAppointment"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/patient/v1/tenants/{tenantId}/appointments/{bookingId}/cancel-request:
    post:
      tags: [Appointments]
      operationId: requestPatientAppointmentCancel
      summary: Request cancellation of an upcoming appointment
      description: |
        **v1 policy (proposed):** create a patient cancel *request* / apply
        `cancelBooking` only when tenant policy allows self-cancel and the
        booking `patient_id` matches the portal patient.

        Staff booking APIs under `/api/tenants/.../bookings` must not be called
        directly by the mobile client (CRM write gate / staff PIN).
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/tenantId"
        - $ref: "#/components/parameters/bookingId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  maxLength: 2000
      responses:
        "200":
          description: Cancelled or request accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppointmentCancelResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/patient/v1/tenants/{tenantId}/appointments/{bookingId}/arrival-intent:
    post:
      tags: [Appointments]
      operationId: postPatientArrivalIntent
      summary: Record patient self-arrival intent for a booking
      description: |
        Authenticated alternative to public `POST /api/public/booking-arrival`
        (token-based). Must verify booking ownership before recording intent.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/tenantId"
        - $ref: "#/components/parameters/bookingId"
      responses:
        "200":
          description: Arrival intent recorded
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean
                    const: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/patient/v1/tenants/{tenantId}/medications:
    get:
      tags: [Medications]
      operationId: listPatientMedications
      summary: List medication portal lines for the linked patient
      description: Reuses `loadMedicationPortalLines`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/tenantId"
      responses:
        "200":
          description: Medication lines
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MedicationListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/patient/v1/tenants/{tenantId}/medications/reorders:
    get:
      tags: [Medications]
      operationId: listPatientMedicationReorders
      summary: List reorder requests for the linked patient
      description: Reuses `loadMedicationReorderRequestsForPatient`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/tenantId"
      responses:
        "200":
          description: Reorder requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MedicationReorderListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

    post:
      tags: [Medications]
      operationId: createPatientMedicationReorder
      summary: Submit a medication reorder request
      description: |
        REST equivalent of `submitPatientMedicationReorderAction`.
        Ownership: prescription `patient_id` must equal resolved portal patient.
        Eligibility via `validatePatientReorderEligibility`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/tenantId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMedicationReorderRequest"
      responses:
        "200":
          description: Reorder created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MedicationReorderCreatedResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/patient/v1/tenants/{tenantId}/account:
    get:
      tags: [Account]
      operationId: getPatientAccountSummary
      summary: Patient-safe account / balance summary
      description: |
        Aggregates invoices / open payment requests for the resolved patient only.
        Amounts and titles are allowed; internal finance workflow fields, staff
        notes, and other patients must never appear.

        Checkout continues via opaque public payment tokens / Stripe checkout URLs
        already issued by FinancialOS (`/pay/{token}`), not by inventing new
        payment-method vault APIs in v1.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/tenantId"
      responses:
        "200":
          description: Account summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountSummaryResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/patient/v1/tenants/{tenantId}/account/payment-requests/{publicToken}/pathway:
    post:
      tags: [Account]
      operationId: selectPatientPaymentPathway
      summary: Select payment pathway for an owned payment request token
      description: |
        Authenticated wrapper around FinancialOS Phase 2B public pathway
        selection. Server must verify the payment request's `patient_id`
        matches the portal patient before applying selection.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/tenantId"
        - name: publicToken
          in: path
          required: true
          schema:
            type: string
            minLength: 10
            maxLength: 4096
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pathway_type]
              properties:
                pathway_type:
                  type: string
                  description: Public pathway option key from FinancialOS Phase 2B
      responses:
        "200":
          description: Pathway selection result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentPathwaySelectionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/patient/v1/tenants/{tenantId}/messages:
    get:
      tags: [Messaging]
      operationId: listPatientMessages
      summary: Patient messaging inbox (deferred)
      description: |
        **Not implementable by reuse today.** Clinic→patient messaging exists as
        staff CRM communications / ReceptionOS Twilio+Resend outbound. There is
        no patient-authenticated message inbox table or portal UI.

        v1 servers SHOULD return `501` with a stable error code until a later
        phase introduces a patient-safe thread model (likely schema work — out of
        1A scope).
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/tenantId"
      responses:
        "501":
          description: Messaging not available in v1
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Supabase Auth access token (`supabase.auth.getSession()` / mobile SDK).

  parameters:
    tenantId:
      name: tenantId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    imageId:
      name: imageId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    bookingId:
      name: bookingId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    BadRequest:
      description: Invalid input
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
    Unauthorized:
      description: Missing or invalid bearer token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
    Forbidden:
      description: Authenticated but not portal-linked for tenant, or feature gated
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
    NotFound:
      description: Resource not found in tenant for this patient (no cross-tenant leak)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
    Conflict:
      description: State conflict (e.g. already cancelled, pending reorder exists)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"

  schemas:
    ErrorBody:
      type: object
      required: [ok, error]
      properties:
        ok:
          type: boolean
          const: false
        error:
          type: string
        code:
          type: string
          description: Stable machine code when available
          examples:
            - unauthenticated
            - invalid_token
            - unlinked
            - ambiguous_mapping
            - inactive_patient
            - wrong_tenant
            - ownership_denied
            - staff_credential_rejected
            - consent_required
            - imaging_disabled
            - invalid_category
            - invalid_mime
            - file_too_large
            - intent_invalid
            - intent_expired
            - intent_replay
            - storage_missing
            - path_mismatch
            - messaging_not_available

    PatientMeResponse:
      type: object
      required: [ok, patientId, firstName, lastName, preferredName, clinic]
      properties:
        ok:
          type: boolean
          const: true
        patientId:
          type: string
          format: uuid
          description: Canonical foundation patient id (`fi_patients.id`)
        firstName:
          type: string
          nullable: true
        lastName:
          type: string
          nullable: true
        preferredName:
          type: string
          nullable: true
        clinic:
          type: object
          required: [id, name, branding]
          properties:
            id:
              type: string
              format: uuid
              description: Public clinic routing id (tenant id used by portal URLs)
            name:
              type: string
              nullable: true
            branding:
              type: object
              required: [logoUrl, primaryColor, secondaryColor, accentColor]
              properties:
                logoUrl:
                  type: string
                  format: uri
                  nullable: true
                  description: Public http(s) logo only — never storage paths or signed URLs
                primaryColor:
                  type: string
                  nullable: true
                secondaryColor:
                  type: string
                  nullable: true
                accentColor:
                  type: string
                  nullable: true

    ConsentStatusResponse:
      type: object
      required: [ok, required, satisfied]
      properties:
        ok:
          type: boolean
          const: true
        required:
          type: boolean
        satisfied:
          type: boolean
        patient_id:
          type: string
          format: uuid
          nullable: true

    PatientGatewayImageItem:
      type: object
      required: [id, category, capturedAt, status, thumbnailUrl, thumbnailExpiresAt]
      properties:
        id:
          type: string
          format: uuid
        category:
          type: string
          description: Patient-facing slot or pathway slug (never staff AI labels)
        capturedAt:
          type: string
          format: date-time
          nullable: true
        status:
          type: string
          enum: [held, released, archived]
        thumbnailUrl:
          type: string
          format: uri
          nullable: true
          description: Short-lived signed URL — never log this value
        thumbnailExpiresAt:
          type: string
          format: date-time
          nullable: true

    PatientGatewayImageListResponse:
      type: object
      required: [ok, images]
      properties:
        ok:
          type: boolean
          const: true
        images:
          type: array
          items:
            $ref: "#/components/schemas/PatientGatewayImageItem"

    PatientGatewayUploadIntentResponse:
      type: object
      required: [ok, intentToken, uploadUrl, expiresAt, imageId, headers]
      properties:
        ok:
          type: boolean
          const: true
        intentToken:
          type: string
          description: HMAC-bound completion token (server-scoped)
        uploadUrl:
          type: string
          format: uri
          description: Short-lived signed upload URL — never log this value
        uploadToken:
          type: string
          nullable: true
        expiresAt:
          type: string
          format: date-time
        imageId:
          type: string
          format: uuid
        headers:
          type: object
          additionalProperties:
            type: string

    VisualSummaryResponse:
      type: object
      required: [ok, items]
      properties:
        ok:
          type: boolean
          const: true
        items:
          type: array
          items:
            type: object
            additionalProperties: true
            description: Sanitized patient portal visual summary item

    PatientGatewayJourneyStep:
      type: object
      required: [key, label, status, completedAt]
      properties:
        key:
          type: string
          enum: [consultation, treatment, procedure, recovery, review, audit]
        label:
          type: string
        status:
          type: string
          enum: [completed, current, upcoming]
        completedAt:
          type: string
          format: date-time
          nullable: true

    PatientGatewayNextAction:
      type: object
      required: [type, label, dueAt, actionKey]
      properties:
        type:
          type: string
          enum: [attend_appointment, upload_images, request_review, await_clinic, none]
        label:
          type: string
        dueAt:
          type: string
          format: date-time
          nullable: true
        actionKey:
          type: string

    PatientGatewayJourneyResponse:
      type: object
      required: [ok, stage, stageLabel, progress, steps, nextAction]
      properties:
        ok:
          type: boolean
          const: true
        stage:
          type: string
          enum: [consultation, treatment, procedure, recovery, review, audit]
        stageLabel:
          type: string
        progress:
          type: object
          required: [currentStep, totalSteps]
          properties:
            currentStep:
              type: integer
              minimum: 1
            totalSteps:
              type: integer
              minimum: 1
        steps:
          type: array
          items:
            $ref: "#/components/schemas/PatientGatewayJourneyStep"
        nextAction:
          $ref: "#/components/schemas/PatientGatewayNextAction"

    PatientGatewayAppointment:
      type: object
      required: [id, type, title, startAt, endAt, location, status, canRequestChange]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          description: Booking type code (patient-safe; not staff procedure internals)
        title:
          type: string
        startAt:
          type: string
          format: date-time
        endAt:
          type: string
          format: date-time
        location:
          type: object
          required: [name]
          properties:
            name:
              type: string
              nullable: true
        status:
          type: string
          enum: [scheduled, confirmed, completed, cancelled, no_show]
        canRequestChange:
          type: boolean
          description: Informational only in 1D — no mutation endpoint is live

    PatientGatewayAppointmentListResponse:
      type: object
      required: [ok, upcoming, past]
      properties:
        ok:
          type: boolean
          const: true
        upcoming:
          type: array
          items:
            $ref: "#/components/schemas/PatientGatewayAppointment"
        past:
          type: array
          items:
            $ref: "#/components/schemas/PatientGatewayAppointment"

    PatientGatewayAppointmentResponse:
      type: object
      required: [ok, appointment]
      properties:
        ok:
          type: boolean
          const: true
        appointment:
          $ref: "#/components/schemas/PatientGatewayAppointment"

    PatientGatewayBillingSummary:
      type: object
      required: [ok, currency, outstandingBalance, paidTotal, nextPaymentDue, hasOutstandingBalance]
      properties:
        ok:
          type: boolean
          const: true
        currency:
          type: string
          example: AUD
        outstandingBalance:
          type: number
        paidTotal:
          type: number
        nextPaymentDue:
          type: object
          nullable: true
          required: [amount, dueAt, invoiceId]
          properties:
            amount:
              type: number
            dueAt:
              type: string
              nullable: true
            invoiceId:
              type: string
              format: uuid
        hasOutstandingBalance:
          type: boolean

    PatientGatewayInvoice:
      type: object
      required: [id, number, title, status, issuedAt, dueAt, currency, total, paid, outstanding, canPay]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        number:
          type: string
          nullable: true
        title:
          type: string
          nullable: true
        status:
          type: string
          enum: [draft, outstanding, partially_paid, paid, overdue, void, refunded]
        issuedAt:
          type: string
          format: date-time
          nullable: true
        dueAt:
          type: string
          nullable: true
        currency:
          type: string
        total:
          type: number
        paid:
          type: number
        outstanding:
          type: number
        canPay:
          type: boolean

    PatientGatewayInvoiceListResponse:
      type: object
      required: [ok, invoices]
      properties:
        ok:
          type: boolean
          const: true
        invoices:
          type: array
          items:
            $ref: "#/components/schemas/PatientGatewayInvoice"

    PatientGatewayInvoiceDetailResponse:
      type: object
      required: [ok, invoice]
      properties:
        ok:
          type: boolean
          const: true
        invoice:
          allOf:
            - $ref: "#/components/schemas/PatientGatewayInvoice"
            - type: object
              required: [lineItems, payments]
              properties:
                lineItems:
                  type: array
                  items:
                    type: object
                    required: [description, quantity, amount]
                    properties:
                      description:
                        type: string
                      quantity:
                        type: number
                      amount:
                        type: number
                payments:
                  type: array
                  items:
                    type: object
                    required: [id, amount, currency, status, paidAt, methodLabel]
                    properties:
                      id:
                        type: string
                        format: uuid
                      amount:
                        type: number
                      currency:
                        type: string
                      status:
                        type: string
                        enum: [pending, succeeded, failed, refunded]
                      paidAt:
                        type: string
                        format: date-time
                        nullable: true
                      methodLabel:
                        type: string

    PatientGatewayPaymentSessionResponse:
      type: object
      required: [ok, invoiceId, checkoutUrl, expiresAt, currency, amount]
      properties:
        ok:
          type: boolean
          const: true
        invoiceId:
          type: string
          format: uuid
        checkoutUrl:
          type: string
          format: uri
          description: Stripe-hosted Checkout URL — never includes FiOS service-role credentials
        expiresAt:
          type: string
          format: date-time
          nullable: true
        currency:
          type: string
        amount:
          type: number
          description: Server-derived outstanding amount in major units

    PatientAppointment:
      type: object
      description: Legacy proposed shape — superseded by PatientGatewayAppointment
      required: [booking_id, start_at, end_at, status, title]
      properties:
        booking_id:
          type: string
          format: uuid
        title:
          type: string
        status:
          type: string
        start_at:
          type: string
          format: date-time
        end_at:
          type: string
          format: date-time
        timezone:
          type: string
          nullable: true
        location:
          type: string
          nullable: true
        can_request_cancel:
          type: boolean
        can_record_arrival:
          type: boolean

    AppointmentListResponse:
      type: object
      description: Legacy proposed shape — superseded by PatientGatewayAppointmentListResponse
      required: [ok, appointments]
      properties:
        ok:
          type: boolean
          const: true
        appointments:
          type: array
          items:
            $ref: "#/components/schemas/PatientAppointment"

    AppointmentCancelResponse:
      type: object
      required: [ok, outcome]
      properties:
        ok:
          type: boolean
          const: true
        outcome:
          type: string
          enum: [cancelled, request_recorded]
        booking_id:
          type: string
          format: uuid

    MedicationLine:
      type: object
      additionalProperties: true
      description: Shape aligned with MedicationPortalLine loader output (patient-safe fields only)

    MedicationListResponse:
      type: object
      required: [ok, lines]
      properties:
        ok:
          type: boolean
          const: true
        lines:
          type: array
          items:
            $ref: "#/components/schemas/MedicationLine"

    MedicationReorder:
      type: object
      additionalProperties: true
      description: Shape aligned with FiMedicationReorderRequestRow (patient-visible fields)

    MedicationReorderListResponse:
      type: object
      required: [ok, requests]
      properties:
        ok:
          type: boolean
          const: true
        requests:
          type: array
          items:
            $ref: "#/components/schemas/MedicationReorder"

    CreateMedicationReorderRequest:
      type: object
      required: [prescription_item_id, delivery_address]
      properties:
        prescription_item_id:
          type: string
          format: uuid
        delivery_address:
          type: string
          minLength: 5
          maxLength: 8000
        payment_acknowledged:
          type: boolean
          description: Required when reorder fee payment is required (current stub)

    MedicationReorderCreatedResponse:
      type: object
      required: [ok, id, status]
      properties:
        ok:
          type: boolean
          const: true
        id:
          type: string
          format: uuid
        status:
          type: string

    AccountOpenItem:
      type: object
      required: [kind, title, amount_due_cents, currency, status]
      properties:
        kind:
          type: string
          enum: [invoice, payment_request]
        title:
          type: string
        amount_due_cents:
          type: integer
        currency:
          type: string
        status:
          type: string
        public_payment_token:
          type: string
          nullable: true
        checkout_url:
          type: string
          format: uri
          nullable: true
        due_at:
          type: string
          format: date-time
          nullable: true

    AccountSummaryResponse:
      type: object
      required: [ok, open_items, currency]
      properties:
        ok:
          type: boolean
          const: true
        currency:
          type: string
          nullable: true
        balance_due_cents:
          type: integer
          nullable: true
        open_items:
          type: array
          items:
            $ref: "#/components/schemas/AccountOpenItem"

    PaymentPathwaySelectionResponse:
      type: object
      required: [ok, pathway_type, status]
      properties:
        ok:
          type: boolean
          const: true
        pathway_type:
          type: string
        status:
          type: string
        confirmation_message:
          type: string
          nullable: true
        continue_to_checkout:
          type: boolean
        checkout_url:
          type: string
          format: uri
          nullable: true
